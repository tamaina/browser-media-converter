name: Pull request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --sort --workspace-concurrency=1 build:package

      - name: Install Playwright Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      # Includes private packages. libjxl-wasm's test:package checks types only;
      # its real codec tests need a separate native/Wasm build (see its README).
      - name: Test packages
        run: pnpm -r --sort --if-present --workspace-concurrency=1 test:package
