name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Test
        run: pnpm test

      - name: Stage packages
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            packages/media-container
            packages/exif-transplant
            packages/webcodecs-color
            packages/webcodecs-avif
            packages/browser-image-resizer-ex
            packages/browser-movie-converter
          )
          mkdir -p .npm-pack
          for package_dir in "${packages[@]}"; do
            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}; already published."
              continue
            fi
            rm -f .npm-pack/*.tgz
            pnpm --filter "${name}" pack --pack-destination .npm-pack
            if ! stage_output="$(npm stage publish .npm-pack/*.tgz --access public 2>&1)"; then
              echo "${stage_output}"
              if grep -q "Cannot stage previously published version" <<<"${stage_output}"; then
                echo "Skipping ${name}@${version}; already staged."
                continue
              fi
              exit 1
            fi
            echo "${stage_output}"
          done
